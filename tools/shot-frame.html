<!DOCTYPE html>
<!-- Test helper (local only): shows an app in a 390px-wide frame, the width of a phone. Used by tools/shots.sh.
     #<app url>|<script to run inside the app>|<JS to run after it> -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#888}iframe{border:0;width:390px;height:1000px;display:block}</style></head>
<body><iframe id="f"></iframe><script>
  const [url, script, after] = decodeURIComponent(location.hash.slice(1)).split('|');
  const f = document.getElementById('f');
  f.onload = async () => {
    if (!script) return;
    const w = f.contentWindow;
    await new Promise((r) => setTimeout(r, 400));
    if (!w.__hub.P()) { w.document.getElementById('newName').value = 'Sam'; w.__hub.ACT.createPlayer(); }
    const src = await (await fetch(script)).text();
    await w.eval(src);
    if (after) w.eval(after);
  };
  f.src = url;
</script></body></html>
